name: Test
defaults:
  run:
    shell: bash

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  package:
    name: Pack npm Candidate
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24.13.0
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Store npm Candidate
        uses: node-3d/addon-tools/actions/npm-candidate-upload@1073c0a6403f6c20df2135f03950a568e865aa16

  unit-tests:
    name: Unit Tests (${{ matrix.target }})
    strategy:
        fail-fast: false
        matrix: &native-matrix
          include:
            - target: windows-x64
              os: windows-2022
              node_arch: x64
              msbuild_arch: x64
              build_platform: x64
            - target: windows-arm64
              os: windows-11-vs2026-arm
              node_arch: arm64
              msbuild_arch: arm64
              build_platform: ARM64
              vs_prerelease: true
            - target: linux-x64
              os: ubuntu-22.04
              node_arch: x64
            - target: linux-arm64
              os: ubuntu-22.04-arm
              node_arch: arm64
            - target: darwin-x64
              os: macos-26-intel
              node_arch: x64
            - target: darwin-arm64
              os: macos-26
              node_arch: arm64

    runs-on: ${{ matrix.os }}

    steps:

      - name: Fetch Repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.13.0
          architecture: ${{ matrix.node_arch }}
          cache: 'npm'

      - name: Print Native Target
        run: node -p "`${process.platform}-${process.arch}`"

      - name: Install Modules
        run: npm ci --ignore-scripts

      - name: Add msbuild to PATH
        if: startsWith(matrix.target, 'windows-')
        uses: microsoft/setup-msbuild@v3
        with:
          msbuild-architecture: ${{ matrix.msbuild_arch }}
          vs-prerelease: ${{ matrix.vs_prerelease || false }}

      - name: Build Pre Step
        run: chmod +x src/extract.sh && src/extract.sh

      - name: Build Unix Binaries
        if: ${{ !startsWith(matrix.target, 'windows-') }}
        run: node src/build-unix

      - name: Build Windows GLEW
        if: startsWith(matrix.target, 'windows-')
        shell: cmd
        run: src/windows-glew.cmd
        env:
          BUILD_PLATFORM: ${{ matrix.build_platform }}

      - name: Build Windows GLFW
        if: startsWith(matrix.target, 'windows-')
        shell: cmd
        run: src/windows-glfw.cmd
        env:
          BUILD_PLATFORM: ${{ matrix.build_platform }}

      - name: Stage Built Binaries
        run: node src/build-post

      - name: Run Unit Tests
        run: npm run test:ci

      - name: Verify macOS deployment target
        if: startsWith(matrix.target, 'darwin-')
        run: |
          set -euo pipefail
          checked=0
          while IFS= read -r -d '' file; do
            versions="$(otool -l "$file" | awk '
              $1 == "cmd" {
                wanted = $2 == "LC_BUILD_VERSION" ? "minos" : ($2 == "LC_VERSION_MIN_MACOSX" ? "version" : "")
              }
              wanted != "" && $1 == wanted { print $2; wanted = "" }
            ')"
            if [ -z "$versions" ] || printf '%s\n' "$versions" | grep -Evxq '13\.5(\.0)?'; then
              echo "Unexpected or missing macOS deployment target: $file" >&2
              printf '%s\n' "$versions" >&2
              exit 1
            fi
            checked=$((checked + 1))
          done < <(find . -type f \( -name '*.a' -o -name '*.dylib' -o -name '*.node' \) \
            -not -path './node_modules/*' -not -path './.git/*' -print0)
          test "$checked" -gt 0
          echo "Verified $checked Mach-O files target macOS 13.5"
      - name: Store Native Candidate
        uses: node-3d/addon-tools/actions/native-candidate-upload@1073c0a6403f6c20df2135f03950a568e865aa16
        with:
          artifact-name: native-${{ matrix.target }}

  consumer-tests:
    name: Packed Consumer (${{ matrix.target }})
    needs: [package, unit-tests]
    strategy:
      fail-fast: false
      matrix: *native-matrix
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24.13.0
          architecture: ${{ matrix.node_arch }}
      - name: Install Packed Consumer Candidate
        id: consumer
        uses: node-3d/addon-tools/actions/consumer-install@1073c0a6403f6c20df2135f03950a568e865aa16
        with:
          package-name: '@node-3d/deps-opengl'
          binary-artifact: native-${{ matrix.target }}
          fixture: test-consumer
      - name: Build Packed Consumer Addon
        working-directory: ${{ steps.consumer.outputs.directory }}
        run: npm run build
      - name: Run Packed Consumer Tests
        working-directory: ${{ steps.consumer.outputs.directory }}
        run: npm test
